name: AINotch
options:
  bundleIdPrefix: com.fourforge
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    ENABLE_HARDENED_RUNTIME: "YES"
    ENABLE_APP_SANDBOX: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  AINotch:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: LICENSE
        buildPhase: resources
      - path: UPSTREAM.md
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: AI Notch
        CFBundleDisplayName: AI Notch
        LSMinimumSystemVersion: "26.0"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "MIT License. See bundled LICENSE and UPSTREAM.md."
    settings:
      base:
        PRODUCT_NAME: AI Notch
        PRODUCT_MODULE_NAME: AINotch
        PRODUCT_BUNDLE_IDENTIFIER: com.fourforge.ainotch
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  AINotchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: AINotch
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AI Notch.app/Contents/MacOS/AI Notch"
        BUNDLE_LOADER: "$(TEST_HOST)"
        PRODUCT_BUNDLE_IDENTIFIER: com.fourforge.ainotch.tests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  AINotch:
    build:
      targets:
        AINotch: all
        AINotchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AINotchTests
