name: Release Windows

# Builds the Setup EXE and portable ZIPs on Windows and drafts a GitHub release.
# Run it from the Actions tab (or push a windows-vX.Y.Z tag). The draft is
# published by hand after checking it.
on:
  push:
    tags: ['windows-v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to build
        default: main
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: Checksums and release notes
        id: meta
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The commit actually checked out, which on a manual run may not be github.sha.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          cd dist
          sha256sum "AI-Notch-$version-Windows-Setup.exe" "AI-Notch-$version-Windows-x64.zip" "AI-Notch-$version-Windows-arm64.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          # The release body is the newest section of RELEASE-NOTES.md.
          awk 'NR>1 && /^## /{exit} {print}' RELEASE-NOTES.md | tail -n +2 > dist/release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ steps.meta.outputs.version }}
          path: |
            windows/dist/*.exe
            windows/dist/*.zip
            windows/dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: windows-v${{ steps.meta.outputs.version }}
          target_commitish: ${{ steps.meta.outputs.sha }}
          name: AI Notch for Windows v${{ steps.meta.outputs.version }}
          body_path: windows/dist/release-notes.md
          files: |
            windows/dist/AI-Notch-${{ steps.meta.outputs.version }}-Windows-Setup.exe
            windows/dist/AI-Notch-${{ steps.meta.outputs.version }}-Windows-x64.zip
            windows/dist/AI-Notch-${{ steps.meta.outputs.version }}-Windows-arm64.zip
            windows/dist/SHA256SUMS.txt
